# 本地开发部署：通过 DEV_DOMAIN 指定的域名访问
# 用法：make dev-deploy / make dev-down

services:
  dev-nginx:
    image: nginx:alpine
    container_name: welink-dev-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dev-nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${DEV_SSL_CERT:-./dev-certs/cert.pem}:/etc/certs/cert.pem:ro
      - ${DEV_SSL_KEY:-./dev-certs/cert.key}:/etc/certs/cert.key:ro
    environment:
      - DEV_DOMAIN=${DEV_DOMAIN:?请设置 DEV_DOMAIN 环境变量}
    depends_on:
      - dev-frontend
    restart: unless-stopped

  dev-frontend:
    build: ./frontend
    container_name: welink-dev-frontend
    depends_on:
      - dev-backend
    restart: unless-stopped

  dev-backend:
    build: ./backend
    container_name: welink-dev-backend
    hostname: backend
    environment:
      - GIN_MODE=release
      - DEMO_MODE=true
      - DATA_DIR=/app/demo-data
      - FEISHU_BOT_MANAGE_URL=http://dev-feishu-bot:8111
    restart: unless-stopped

  dev-feishu-bot:
    profiles: ["feishu"]
    build: ./feishu-bot
    container_name: welink-dev-feishu-bot
    depends_on:
      - dev-backend
    environment:
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - WELINK_BASE_URL=http://dev-backend:8080
      - WELINK_TOKEN=${WELINK_TOKEN:-}
      - SESSION_STORE_PATH=/var/lib/welink-feishu/sessions.json
      - MANAGE_ADDR=:8111
      - ALLOWED_USERS=${ALLOWED_USERS:-}
      - STREAM_MODE=${STREAM_MODE:-md}
      - ANNOUNCE_CHAT_ID=${ANNOUNCE_CHAT_ID:-}
      - HEARTBEAT_INTERVAL_SEC=${HEARTBEAT_INTERVAL_SEC:-30}
      - DISCONNECT_COOLDOWN_MIN=${DISCONNECT_COOLDOWN_MIN:-60}
    volumes:
      - dev-feishu-bot-sessions:/var/lib/welink-feishu
    restart: unless-stopped

  dev-wecom-bot:
    profiles: ["wecom"]
    build: ./wecom-bot
    container_name: welink-dev-wecom-bot
    depends_on:
      - dev-backend
    environment:
      - WECOM_BOT_ID=${WECOM_BOT_ID:-}
      - WECOM_BOT_SECRET=${WECOM_BOT_SECRET:-}
      - WELINK_BASE_URL=http://dev-backend:8080
      - WELINK_TOKEN=${WELINK_TOKEN:-}
      - ALLOWED_USERS=${WECOM_ALLOWED_USERS:-}
      - BOT_NAME=${WECOM_BOT_NAME:-}
    restart: unless-stopped

volumes:
  dev-feishu-bot-sessions:
